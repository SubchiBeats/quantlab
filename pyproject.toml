[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.1.0"
description = "Local-first quantitative research platform: backtesting, validation, and an append-only research vault. Research tool only - not a trading bot."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
quantlab = "quantlab.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.hatch.build.targets.wheel.force-include]
"src/quantlab/foundation/migrations" = "quantlab/foundation/migrations"
"src/quantlab/reports/templates" = "quantlab/reports/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
